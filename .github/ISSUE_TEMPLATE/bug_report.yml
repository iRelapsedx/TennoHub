name: Bug report
description: Report a problem, crash or error in Tenno Hub.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. Reports are public, so please don't include passwords, Discord webhook links or other personal information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
      placeholder: When I open …, Tenno Hub shows … instead of …
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The steps that lead to the problem, if you know them.
      placeholder: |
        1. Open …
        2. Click …
        3. See the error
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The part of Tenno Hub where the problem happens.
      options:
        - Home
        - World state
        - Origin System map
        - Market
        - Builds
        - Codex or relics
        - Profile
        - Trackers or mission detection
        - Community
        - Discord
        - Notifications
        - Screenshots
        - Settings or setup wizard
        - Installation or startup
        - Other
  - type: input
    id: tennohub-version
    attributes:
      label: Tenno Hub version
      description: Shown in Settings → About.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Warframe platform
      description: The platform selected in Settings → General.
      placeholder: PC
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 Home 24H2
  - type: textarea
    id: errors
    attributes:
      label: Error messages
      description: Error messages Tenno Hub showed, if any.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: Screenshots or anything else that might help. You can drag files into this box.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This report contains no passwords, webhook links or other personal information.
          required: true
